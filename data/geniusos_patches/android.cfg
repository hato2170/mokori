# geniusOS UEFI GRUB Config
set timeout=10

menuentry "geniusOS v1.0.1 Live (Pure White Minimalism)" --class android-x86 {
	search --set=root --file /kernel
	linux /kernel root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug quiet DATA=
	initrd /initrd.img
}

menuentry "geniusOS v1.0.1 on Microsoft Surface (Power Button & Touch Support)" --class android-x86 {
	search --set=root --file /kernel
	linux /kernel root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug SURFACE=1 mem_sleep_default=deep button.lid_init_state=open acpi_sleep=s3_bios,s3_mode handle_power_key=1 suspend=1 quiet DATA=
	initrd /initrd.img
}

menuentry "geniusOS v1.0.1 (Auto-Install to specified disk)" --class android-x86 {
	search --set=root --file /kernel
	linux /kernel root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug AUTO_INSTALL=0 quiet DATA=
	initrd /initrd.img
}

menuentry "geniusOS v1.0.1 (Auto-Update)" --class android-x86 {
	search --set=root --file /kernel
	linux /kernel root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug AUTO_INSTALL=update quiet DATA=
	initrd /initrd.img
}

menuentry "geniusOS v1.0.1 (Install to harddisk)" --class android-x86 {
	search --set=root --file /kernel
	linux /kernel root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug INSTALL=1 DEBUG=
	initrd /initrd.img
}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       