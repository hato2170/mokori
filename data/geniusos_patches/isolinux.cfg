default vesamenu.c32
timeout 300

menu background android-x86.png
menu title geniusOS v1.0.1 (Pure White) Live & Install
menu color border 0 #ffffffff #00000000
menu color sel 7 #ffffff00 #ff000000
menu color title 0 #ffffffff #00000000
menu color tabmsg 0 #ffffffff #00000000
menu color unsel 0 #ffffffff #00000000
menu color hotsel 0 #ffffff00 #ff000000
menu color hotkey 7 #ffffff00 #00000000

label livem
	menu label Live CD - ^Run geniusOS (Pure White Mode)
	kernel /kernel
	append initrd=/initrd.img root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug quiet DATA=

label surface
	menu label Live CD - ^Run geniusOS on Microsoft Surface (Power & Touch)
	kernel /kernel
	append initrd=/initrd.img root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug SURFACE=1 mem_sleep_default=deep button.lid_init_state=open acpi_sleep=s3_bios,s3_mode handle_power_key=1 suspend=1 quiet DATA=

label vesa
	menu label Live CD - ^VESA mode
	kernel /kernel
	append initrd=/initrd.img root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug nomodeset vga=788 quiet DATA=

label debug
	menu label Live CD - ^Debug mode
	kernel /kernel
	append initrd=/initrd.img root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug DEBUG=2 DATA=

label install
	menu label Installation - ^Install geniusOS to harddisk
	kernel /kernel
	append initrd=/initrd.img root=/dev/ram0 androidboot.selinux=permissive buildvariant=userdebug INSTALL=1 DEBUG=
                                                                                                                                                                                                                                                                                                                                                                                                               