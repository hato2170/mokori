

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>mokori</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #faf9f6;
      color: #34342f;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 390px;
      padding: 32px 25px;
      background: white;
      border: 1px solid #eeece5;
      border-radius: 24px;
    }
    .goat { text-align: center; font-size: 38px; }
    h1 {
      margin: 8px 0;
      text-align: center;
      font-size: 29px;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      color: #99968d;
      font-size: 13px;
      margin: 10px 0 25px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      background: #f6f5f0;
      border-radius: 12px;
    }
    .tabs button {
      flex: 1;
      padding: 11px 5px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #88867e;
      cursor: pointer;
    }
    .tabs button.active { background: white; color: #34342f; }
    .tabs button:disabled { opacity: .5; cursor: not-allowed; }
    #registerNotice {
      margin: 14px 0 0;
      padding: 11px 13px;
      border: 1px solid #f0dcc4;
      border-radius: 11px;
      background: #fdf6ec;
      color: #8a6a45;
      font-size: 12.5px;
      line-height: 1.6;
    }
    #registerNotice[hidden] { display: none; }
    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e7e5dd;
      border-radius: 11px;
      font-size: 15px;
    }
    .submit {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #424239;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    .submit:disabled { opacity: .55; }
    #message {
      min-height: 20px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      color: #806254;
    }
    .foot {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #b0ada4;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="goat">🐐</div>
    <h1>mokori</h1>
    <p class="subtitle">いつものみんなと、いつもの場所で。</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">ログイン</button>
      <button id="registerTab" type="button">新規登録</button>
    </div>
    <p id="registerNotice" role="status" hidden></p>

    <form id="authForm">
      <label for="username">ユーザー名</label>
      <input id="username" name="username"
        minlength="2" maxlength="20" autocomplete="username"
        placeholder="ユーザー名" required>

      <label for="password">パスワード</label>
      <input id="password" name="password" type="password"
        minlength="8" maxlength="128" autocomplete="current-password"
        placeholder="8文字以上" required>

      <button class="submit" id="submitButton" type="submit">ログイン</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <div class="foot">mokori · みんなの居場所</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ↓ この設定部分を、自分のFirebaseの設定に置き換える
    　　　const firebaseConfig = {
  apiKey: "AIzaSyAXv7r2M0q22JLa0s4XcpPomf-KW19CPPE",
  authDomain: "mokori-by-riona-iwakami.firebaseapp.com",
  projectId: "mokori-by-riona-iwakami",
  storageBucket: "mokori-by-riona-iwakami.firebasestorage.app",
  messagingSenderId: "78875890394",
  appId: "1:78875890394:web:ee631706d895893ec10be3"
  };    
    // ↑ 設定はここまで

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const registerNotice = document.getElementById("registerNotice");

    const REGISTRATION_CLOSED_TEXT =
      "現在、新規登録は一時停止しています。既存アカウントでログインしてください。";

    let mode = "login";
    let registrationOpen = true;

    function setMode(nextMode) {
      if (nextMode === "register" && !registrationOpen) {
        showRegistrationClosed();
        return;
      }
      mode = nextMode;
      const registering = mode === "register";
      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);
      submitButton.textContent = registering ? "アカウントを作成" : "ログイン";
      passwordInput.autocomplete = registering ? "new-password" : "current-password";
      message.textContent = "";
    }

    function showRegistrationClosed(text) {
      registrationOpen = false;
      registerTab.disabled = true;
      registerTab.setAttribute("aria-disabled", "true");
      registerNotice.hidden = false;
      registerNotice.textContent = text || REGISTRATION_CLOSED_TEXT;
      if (mode === "register") {
        mode = "login";
        loginTab.classList.add("active");
        registerTab.classList.remove("active");
        submitButton.textContent = "ログイン";
        passwordInput.autocomplete = "current-password";
      }
    }

    // サーバー側の設定（/api/config）で新規登録が止まっているかを確認する
    (async function loadConfig() {
      try {
        const response = await fetch("/api/config", {
          headers: { Accept: "application/json" },
          cache: "no-store"
        });
        if (!response.ok) return;
        const config = await response.json();
        if (config && config.registrationOpen === false) {
          showRegistrationClosed(config.registrationMessage);
        }
      } catch (_) {
        // 設定が読めないときは通常表示のまま（送信時にサーバーが 403 で断る）
      }
    })();

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (mode === "register" && !registrationOpen) {
        showRegistrationClosed();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "処理中…";
      message.textContent = "";

      try {
        const response = await fetch(
          mode === "register" ? "/api/register" : "/api/login",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: passwordInput.value
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          if (result && result.registrationDisabled) {
            showRegistrationClosed(result.error);
          }
          throw new Error(result.error || "処理に失敗しました。");
        }

        await auth.signInWithCustomToken(result.token);

      window.location.href = "/chat.html";
      } catch (error) {
        console.error(error);
        message.textContent =
          error.message === "Failed to fetch"
            ? "サーバーに接続できません。少し待って再度試してね。"
            : error.code === "auth/invalid-custom-token"
            ? "認証設定を確認する必要があります。"
            : error.message || "エラーが発生しました。";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent =
          mode === "register" ? "アカウントを作成" : "ログイン";
      }
    });
  </script>
</body>
</html>
