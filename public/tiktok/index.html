<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>もこりTikTok · ショート動画ビューア</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #000; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
  .logo .ico { font-size: 20px; }
  .logo .tk { color: #25f4ee; text-shadow: 2px 0 #fe2c55; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    color: #cbd5e1; text-decoration: none; font-size: 12px; background: #1e293b;
    padding: 7px 11px; border-radius: 999px; border: 1px solid #334155;
  }
  .tabs { display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto; }
  .tab {
    flex: 0 0 auto; padding: 9px 15px; border-radius: 999px; background: #16181d; border: 1px solid #2a2f3a;
    color: #cbd5e1; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .tab.active { background: #fe2c55; border-color: #fe2c55; color: #fff; }
  .panel { padding: 10px 16px 2px; }
  .search-row { display: flex; gap: 8px; }
  .search-row input {
    flex: 1; min-width: 0; background: #16181d; border: 1px solid #2a2f3a; border-radius: 12px;
    padding: 12px 14px; color: #fff; font-size: 15px; outline: none;
  }
  .search-row input:focus { border-color: #25f4ee; }
  .search-row button {
    padding: 0 18px; border: 0; border-radius: 12px; background: linear-gradient(135deg,#25f4ee,#fe2c55);
    color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .hint { color: #94a3b8; font-size: 12px; margin-top: 8px; line-height: 1.6; }
  .status { padding: 14px 16px; color: #94a3b8; font-size: 13px; }
  .status.err { color: #fca5a5; }
  .grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px 16px;
  }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card {
    position: relative; aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; background: #16181d;
    cursor: pointer; border: 1px solid #23262e;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .meta {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 8px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    font-size: 11px; line-height: 1.35;
  }
  .card .author { font-weight: 700; color: #fff; margin-bottom: 2px; }
  .card .plays { color: #25f4ee; font-weight: 700; font-size: 11px; }
  .card .desc { color: #e2e8f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .play-badge {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .profile-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
  .profile-bar img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #1e293b; }
  .profile-bar .pname { font-weight: 800; font-size: 15px; }
  .profile-bar .pmeta { color: #94a3b8; font-size: 12px; margin-top: 2px; }

  /* プレイヤー */
  #player {
    position: fixed; inset: 0; z-index: 200; background: #000; display: none;
    flex-direction: column;
  }
  #player.open { display: flex; }
  #player video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #000; }
  #player .top {
    position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent); z-index: 3;
  }
  #player .close {
    width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.16);
    color: #fff; font-size: 18px; cursor: pointer;
  }
  #player .open-orig {
    color: #fff; text-decoration: none; font-size: 12px; background: rgba(255,255,255,0.16);
    padding: 8px 12px; border-radius: 999px;
  }
  #player .info {
    padding: 10px 16px 20px; background: #000; font-size: 13px; line-height: 1.5; max-height: 30vh; overflow: auto;
  }
  #player .info .who { font-weight: 800; color: #25f4ee; margin-bottom: 4px; }
  #player .info .body { color: #e2e8f0; white-space: pre-wrap; word-break: break-word; }
  #player .switch { display: flex; gap: 10px; padding: 0 16px 14px; }
  #player .switch button {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #1e293b;
    color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  #player .switch button:disabled { opacity: 0.4; }

  /* 読み込み中 */
  .spinner {
    width: 30px; height: 30px; border: 3px solid #334155; border-top-color: #25f4ee; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 18px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="ico">🎵</span><span>もこり<span class="tk">TikTok</span></span></div>
  <div class="nav-links">
    <a href="/tensai-proxy/">⚡ プロキシ</a>
    <a href="/">🏠 もこり</a>
  </div>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-mode="trending">🔥 おすすめ</button>
  <button class="tab" data-mode="user">👤 ユーザー</button>
  <button class="tab" data-mode="tag"># ハッシュタグ</button>
  <button class="tab" data-mode="url">🔗 URL再生</button>
</div>

<div class="panel" id="panel"></div>
<div id="status" class="status"></div>
<div class="grid" id="grid"></div>

<div id="player">
  <div class="top">
    <button class="close" id="closeBtn">✕</button>
    <a class="open-orig" id="openOrig" href="#" target="_blank" rel="noopener">TikTokで開く</a>
  </div>
  <video id="video" controls playsinline webkit-playsinline preload="metadata"></video>
  <div class="info">
    <div class="who" id="pAuthor"></div>
    <div class="body" id="pDesc"></div>
  </div>
  <div class="switch">
    <button id="prevBtn">◀ 前へ</button>
    <button id="nextBtn">次へ ▶</button>
  </div>
</div>

<script>
(function () {
  var state = { mode: 'trending', videos: [], index: -1, profile: null };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), statusEl = $('status'), panel = $('panel'), player = $('player'), video = $('video');

  function media(url) {
    if (!url) return '';
    return '/api/media?url=' + encodeURIComponent(url);
  }
  function fmt(n) {
    if (n === null || n === undefined) return '';
    if (n >= 100000000) return (n / 100000000).toFixed(1).replace('.0','') + '億';
    if (n >= 10000) return (n / 10000).toFixed(1).replace('.0','') + '万';
    return String(n);
  }
  function setStatus(text, isErr) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }
  function loading() { setStatus(''); grid.innerHTML = '<div class="spinner" style="grid-column:1/-1"></div>'; }

  function renderPanel() {
    if (state.mode === 'trending') {
      panel.innerHTML = '<div class="hint">いま人気のショート動画。タップでその場で再生します。</div>';
    } else if (state.mode === 'user') {
      panel.innerHTML = '<div class="search-row"><input id="qUser" type="text" placeholder="@ユーザー名（例: tiktok）" autocomplete="off"><button id="goUser">表示</button></div>'
        + '<div class="hint">@は付けても付けなくてもOK。その人の動画一覧が出ます。</div>';
      $('goUser').onclick = loadUser;
      $('qUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadUser(); });
    } else if (state.mode === 'tag') {
      panel.innerHTML = '<div class="search-row"><input id="qTag" type="text" placeholder="ハッシュタグ（例: 猫, dance, 推し）" autocomplete="off"><button id="goTag">表示</button></div>'
        + '<div class="hint">#は不要。#が付いたタグの動画が並びます。</div>';
      $('goTag').onclick = loadTag;
      $('qTag').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadTag(); });
    } else {
      panel.innerHTML = '<div class="search-row"><input id="qUrl" type="text" placeholder="TikTokのURLを貼り付け" autocomplete="off"><button id="goUrl">再生</button></div>'
        + '<div class="hint">https://www.tiktok.com/@user/video/123... でも、共有の短いリンクでもOK。</div>';
      $('goUrl').onclick = loadUrl;
      $('qUrl').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadUrl(); });
    }
  }

  function renderGrid() {
    if (!state.videos.length) { grid.innerHTML = ''; return; }
    grid.innerHTML = state.videos.map(function (v, i) {
      return '<div class="card" data-i="' + i + '">'
        + (v.cover ? '<img loading="lazy" src="' + media(v.cover) + '" alt="">' : '')
        + '<div class="play-badge">▶</div>'
        + '<div class="meta">'
        + '<div class="author">@' + escapeHtml(v.author || v.nickname || '') + '</div>'
        + '<div class="plays">' + (v.plays ? '▶ ' + fmt(v.plays) : '') + '</div>'
        + '<div class="desc">' + escapeHtml(v.desc || '') + '</div>'
        + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('.card'), function (el) {
      el.onclick = function () { openPlayer(Number(el.getAttribute('data-i'))); };
    });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function loadTrending() {
    state.mode = 'trending'; renderPanel(); loading();
    fetch('/api/tiktok/feed?region=JP').then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || '取得できませんでした');
      state.videos = d.videos || [];
      setStatus(state.videos.length ? '' : '動画が見つかりませんでした');
      renderGrid();
    }).catch(function (e) { grid.innerHTML = ''; setStatus('おすすめを取得できませんでした：' + e.message + '（少し待って再度お試しください）', true); });
  }
  function loadUser() {
    var v = ($('qUser').value || '').replace(/^@/, '').trim();
    if (!v) return;
    loading();
    fetch('/api/tiktok/user?user=' + encodeURIComponent(v)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || '取得できませんでした');
      state.videos = d.videos || [];
      state.profile = d.profile || null;
      var pf = d.profile || {};
      setStatus('');
      if (state.videos.length) {
        var bar = document.createElement('div');
        bar.className = 'profile-bar';
        bar.innerHTML = (pf.avatar ? '<img src="' + media(pf.avatar) + '" alt="">' : '')
          + '<div><div class="pname">' + escapeHtml(pf.nickname || ('@' + v)) + '</div>'
          + '<div class="pmeta">@' + escapeHtml(v) + (pf.followers !== undefined && pf.followers !== null ? ' · フォロワー ' + fmt(pf.followers) : '') + '</div></div>';
        grid.parentNode.insertBefore(bar, grid);
      }
      renderGrid();
    }).catch(function (e) { grid.innerHTML = ''; setStatus('@' + v + ' の動画を取得できませんでした：' + e.message, true); });
  }
  function loadTag() {
    var v = ($('qTag').value || '').replace(/^#/, '').trim();
    if (!v) return;
    loading();
    fetch('/api/tiktok/tag?tag=' + encodeURIComponent(v)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || '取得できませんでした');
      state.videos = d.videos || [];
      setStatus(state.videos.length ? '' : '#' + v + ' の動画が見つかりませんでした');
      renderGrid();
    }).catch(function (e) { grid.innerHTML = ''; setStatus('#' + v + ' を取得できませんでした：' + e.message, true); });
  }
  function loadUrl() {
    var v = ($('qUrl').value || '').trim();
    if (!v) return;
    loading();
    fetch('/api/tiktok/item?url=' + encodeURIComponent(v)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || '取得できませんでした');
      state.videos = [d.video];
      renderGrid();
      setStatus('タップで再生、または下のボタンで再生');
      openPlayer(0);
    }).catch(function (e) { grid.innerHTML = ''; setStatus('URLを再生できませんでした：' + e.message, true); });
  }

  function openPlayer(i) {
    var v = state.videos[i];
    if (!v) return;
    state.index = i;
    player.classList.add('open');
    video.src = media(v.play);
    video.play().catch(function () {});
    $('pAuthor').textContent = '@' + (v.author || v.nickname || '');
    $('pDesc').textContent = v.desc || '';
    $('openOrig').href = v.id ? ('/api/proxy?url=' + encodeURIComponent('https://www.tiktok.com/@' + (v.author || 'i') + '/video/' + v.id)) : '/tensai-proxy/';
    $('prevBtn').disabled = i <= 0;
    $('nextBtn').disabled = i >= state.videos.length - 1;
  }
  function closePlayer() {
    player.classList.remove('open');
    video.pause();
    video.removeAttribute('src');
    video.load();
  }
  $('closeBtn').onclick = closePlayer;
  $('prevBtn').onclick = function () { if (state.index > 0) openPlayer(state.index - 1); };
  $('nextBtn').onclick = function () { if (state.index < state.videos.length - 1) openPlayer(state.index + 1); };

  // 上下スワイプで送り
  var touchStartY = 0;
  player.addEventListener('touchstart', function (e) { touchStartY = e.touches[0].clientY; }, { passive: true });
  player.addEventListener('touchend', function (e) {
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dy) < 70) return;
    if (dy < 0 && state.index < state.videos.length - 1) openPlayer(state.index + 1);
    else if (dy > 0 && state.index > 0) openPlayer(state.index - 1);
  }, { passive: true });

  // タブ
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      state.mode = t.getAttribute('data-mode');
      state.videos = []; state.index = -1;
      grid.innerHTML = ''; setStatus('');
      var bars = document.querySelectorAll('.profile-bar');
      Array.prototype.forEach.call(bars, function (b) { b.remove(); });
      renderPanel();
      if (state.mode === 'trending') loadTrending();
    };
  });

  renderPanel();
  loadTrending();
})();
</script>
</body>
</html>
